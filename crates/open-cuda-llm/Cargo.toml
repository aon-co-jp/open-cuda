[package]
name = "open-cuda-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "自己回帰デコーダ(GPT系、KVキャッシュ付き貪欲デコード)のforward pass実装。前回のマーケティング調査ロードマップで言う「1位vLLM相当」のMVP(バッチ処理・PagedAttention・連続バッチング等の本家vLLMの中核最適化は未実装、単一シーケンスの逐次デコードのみ)"

[dependencies]
opencuda-core.workspace = true
opencuda-blas.workspace = true
anyhow.workspace = true
tracing.workspace = true
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 2026-08-08新設: PCA較正版MLA圧縮(`enable_mla_kv_compression_calibrated`)の
# 固有値分解(実活性化統計の共分散行列からの主成分抽出)用。純Rust実装
# (LAPACK/BLASバックエンド不要)のため、このマシンにCUDA/ROCm/oneAPI
# ツールチェインが無くてもビルド・実行できる(既存のcuBLAS等スタブと同じ
# 「検証可能な範囲でのみ実装する」方針に合致)。
nalgebra = "0.33"

# 2026-08-10新設: WASM(wasm32-unknown-unknown)ターゲット対応。
# 通常ビルドが使う`tokenizers`の`onig`feature(C言語oniguruma、`onig_sys`
# クレート経由でCコードをコンパイルする)は、freestandingターゲットである
# wasm32-unknown-unknownに適切なlibc/sysrootが無いためビルド不能。
# `unstable_wasm`feature(純Rust実装の`fancy-regex`を使う)へ切り替えると
# C依存が消え、`opencuda-core`/`opencuda-blas`/`nalgebra`を含む全依存
# グラフがwasm32へ問題なくコンパイルできることを確認済み(検証手順は
# CLAUDE.md HANDOFF参照)。ネイティブビルドは`cfg(not(target_arch =
# "wasm32"))`で完全に分離されているため、この変更による既存のWindows/
# Linuxネイティブビルドへの影響は無い。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.20", default-features = false, features = ["unstable_wasm"] }
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
opencuda-cpu.workspace = true
opencuda-vulkan = { workspace = true, features = ["real-vulkan"] }
